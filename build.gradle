apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'application'

sourceSets.main.java.exclude 'com/example/HelloWorld*', 'com/lightbend/**'


repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
  implementation 'com.typesafe.akka:akka-actor_2.13:2.6.21'
  implementation 'org.knowm.xchart:xchart:3.8.5'
  implementation 'ch.qos.logback:logback-classic:1.2.13'
}

mainClassName = "com.example.Main"

run {
  standardInput = System.in
}
